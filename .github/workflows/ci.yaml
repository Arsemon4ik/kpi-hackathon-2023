name: Run Tests and Send Report

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi


      - name: Run tests and generate report
        run: pytest ./tests/ -v --tb=line -rE --durations=0 --disable-warnings --junitxml=report.xml || true

      - name: Send report to analysis server
        run: |
          echo "Sending report to server..."
          curl --fail -X POST ${{ secrets.SERVER_URL }} \
               -H "Content-Type: multipart/form-data" \
               -F "file=@report.xml"
